      modalAnnouncementTitle = "2nd Annual CTE Expo"
      modalAnnouncement = "<p>Join us at our 2nd Annual CTE Expo! Discover how our programs in Video Game Design, IT, and Web Development are empowering tomorrow's workforce - and learn how you can get involved.</p><p>See you April 29th, 4 - 7PM!</p><p><a href='#' class='underline font-bold'>RSVP Link</a></p>"
