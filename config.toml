  [languages.es]
    languageName = "Spanish"
    weight = 2

    [languages.es.params]
      announcement = "¡Por favor complete la Encuesta Escolar de NYC! Sus comentarios son importantes para nosotros. <a href='https://surveys.panoramaed.com/nycdoe/login' class='underline' target='_blank'>Haga clic aquí</a> para acceder a la encuesta."
      modalAnnouncementTitle = "2ª Exposición Anual de CTE"
      modalAnnouncement = "<p>¡Únase a nuestra 2ª Exposición Anual de CTE! Descubra cómo nuestros programas en Diseño de Videojuegos, Tecnología de la Información y Desarrollo Web están capacitando a la fuerza laboral del mañana - y aprenda cómo puede involucrarse.</p><p>¡Nos vemos el 29 de abril, de 4 a 7PM!</p><p><a href='#' class='underline font-bold'>Enlace para RSVP</a></p>"
      modalAnnouncementImage = "/cte-expo-spanish.png"
      description = "Descubra la escuela secundaria Academy of Innovative Technology en Cypress Hills, Brooklyn, una enriquecedora escuela secundaria pública de la ciudad de Nueva York para los grados 9 a 12, que ofrece tres programas CTE aprobados por el estado de New York y una amplia gama de apoyos para garantizar el éxito de los estudiantes."
      backToTopText = "Volver al inicio"
      backToTopAlt = "Click here to go back to the top."

