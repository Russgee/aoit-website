<section class="px-6 container mx-auto my-12" id="about">
    <h2 class="text-aoit-400 text-2xl font-bold">Department Members</h2>
    <table class="w-full my-6 table-auto border-collapse border border-slate-500">
        <tr class="">
            <th class="border border-slate-700 p-4">Name & Title</th>
            <th class="border border-slate-700 p-4">Contact Information</th>
        </tr>
        
        {{ range .Params.team }}
        <tr>
            <td class="border border-slate-700 p-4">
                <span class="font-semibold">{{ .name }}</span><br>
                {{ .title }}
            </td>
            <td class="border border-slate-700 p-4">
                <a href="mailto:{{.email}}" class="underline text-aoit-500">{{ .email }}</a>
            </td>
        </tr>
        {{ end }}
    </table>
</section>
