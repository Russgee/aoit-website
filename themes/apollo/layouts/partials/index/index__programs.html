<section class="px-6 pt-20 container mx-auto">
    <h2 class="text-3xl font-bold text-center text-aoit-400">Our CTE Programs</h2>

    <div class="lg:grid lg:grid-cols-3 lg:gap-8">
        {{ range first 3 (where .Site.RegularPages "Section" "cte") }}
        <article class="flex flex-col justify-between rounded-cell bg-white my-12 pb-12 relative overflow-hidden hover:bg-aoit-400 transition-all transition-300 group">
            <img class="top-2 right-0 absolute" src="{{ .Params.logo }}">
            <strong class="text-2xl font-semibold block mt-32 text-aoit-400 group-hover:text-white">{{ .Title }}</strong>
            <p class="mt-4 mb-8 group-hover:text-white">{{ .Description}}</p>
            <a class="btn bg-aoit-500 text-white px-8 rounded-2xl self-start hover:bg-aoit-900" href="{{ .Permalink }}">{{ .Params.buttonText }}</a>
        </article>
        {{ end }}
    </div>
    <hr class="border-aoit-700">
</section>
<section class="px-6 pt-12 pb-24 container mx-auto lg:flex lg:justify-between lg:items-center">
    <h2 class="text-2xl mb-8 lg:m-0">Other Programs:</h2>

    <div class="lg:grid lg:grid-cols-4 lg:text-center lg:gap-12 w-10/12">
        {{ range .Params.programs }}
        <details class="relative p-6">
            <summary>
                <span class="font-semibold text-aoit-700">{{ .title }}</span>
            </summary>
            <p class="my-6"> {{ .description }}</p>
        </details>
        {{ end }}
    </div>
</section>
