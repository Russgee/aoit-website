<header class="relative min-h-[80vh] w-10/12 mb-20 mx-auto shadow-2xl shadow-aoit-500 rounded-3xl bg-cover bg-no-repeat bg-center flex flex-col justify-between items-center text-white text-center px-6">
    <video class="absolute top-0 left-0 h-full w-full object-cover rounded-3xl z-0" playsInline autoplay muted loop>
        <source src="/lfs/bg-video.mp4" type="video/mp4">
    </video>
    <div class="absolute inset-0 rounded-3xl bg-aoit-700 opacity-80 z-10"></div>
    <section class="relative z-20 flex flex-col justify-center items-center xl:w-6/12 mt-16 md:mt-auto md:mb-auto">
        <h1 class="font-bold text-white text-2xl mb-6 md:text-4xl xl:text-5xl">{{ .Params.header.header__title }}</h1>
        <p class="lg:text-xl lg:w-8/12 lg:mx-auto">{{ .Params.header.header__description }}</p>

        <div class="my-10 flex flex-wrap justify-center h-36 items-center md:flex-nowrap md:justify-evenly md:w-[35rem] md:h-fit md:mx-auto">
            <a href='{{ "about" | relLangURL }}' class="w-64 md:w-60 justify-center btn px-4 flex items-center hover:bg-aoit-500 hover:text-white"> 
                <span class="material-symbols-outlined">info</span> 
                <span class="ml-2">{{ .Params.header.header__buttonTitle }}</span>
            </a>

            <a href='https://docs.google.com/presentation/d/1Lp-M2_g5SMc-M3gPV2IrrtrkjicCMR25y595AvpFySM/edit?usp=sharing' target="_blank" class="w-64 md:w-60 justify-center btn px-4 flex items-center hover:bg-aoit-500 hover:text-white"> 
                <span class="material-symbols-outlined">slideshow</span> 
                <span class="ml-2">{{ i18n "slideshow_label" }}</span>
            </a>
        </div>
    </section>

    <section class="absolute mb-2 bottom-5 px-4 z-20 w-full overflow-x-scroll md:mb-0 ">    
        <div class="events flex gap-x-4 min-w-[140vw]">
            <!-- Add event items here -->
        </div>
    </section>
</header>
