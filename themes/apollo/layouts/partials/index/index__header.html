<header class="header h-screen bg-cover bg-no-repeat bg-center flex justify-center items-center relative text-white text-center px-6">
    <video class="h-screen w-full absolute object-cover" playsInline autoplay muted loop>
        <source src="/lfs/bg-video.mp4" type="video/mp4">
    </video>
    <div class="overlay bg-aoit-700"></div>
    <section class="relative z-20 xl:w-6/12">
        <h1 class="font-bold text-white text-2xl mb-6 md:text-4xl xl:text-5xl">{{ .Params.header.header__title }}</h1>
        <p class="lg:text-xl lg:w-8/12 lg:mx-auto">{{ .Params.header.header__description }}</p>

        <div class="my-10 flex flex-wrap justify-center h-36 items-center md:flex-nowrap md:justify-evenly md:w-[35rem] md:h-fit md:mx-auto">
            <a href='{{ "about" | relLangURL }}' class="w-64 md:w-60 justify-center btn px-4 flex items-center hover:bg-aoit-500 hover:text-white"> <span class="material-symbols-outlined">
                info
                </span> <span class="ml-2">{{ .Params.header.header__buttonTitle }}</span>
            </a>

            <a href='https://docs.google.com/presentation/d/1Lp-M2_g5SMc-M3gPV2IrrtrkjicCMR25y595AvpFySM/edit?usp=sharing' target="_blank" class="w-64 md:w-60 justify-center btn px-4 flex items-center hover:bg-aoit-500 hover:text-white"> <span class="material-symbols-outlined">
                slideshow
                </span> <span class="ml-2">{{ i18n "slideshow_label" }}</span>
            </a>
        </div>
    </section>
</header>
