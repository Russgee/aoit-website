<header class="header h-screen bg-cover bg-no-repeat bg-center flex justify-center items-center relative text-white text-center px-6">
    <video class="h-screen w-full absolute object-cover" playsInline autoplay muted loop>
        <source src="/lfs/bg-video.mp4" type="video/mp4">
    </video>
    <div class="overlay bg-aoit-700"></div>
    <section class="relative z-20 md:w-6/12">
        <h1 class="font-bold text-white text-2xl mb-6 md:text-5xl">{{ .Params.header.header__title }}</h1>
        <p class="lg:text-xl lg:w-8/12 lg:mx-auto">{{ .Params.header.header__description }}</p>

        <div class="my-10 flex justify-center">
            <a href="/about" class="btn px-8 flex items-center w-48 hover:bg-aoit-500 hover:text-white"> <span class="material-symbols-outlined">
                info
                </span> <span class="ml-2">Learn More</span></a>
        </div>
    </section>
</header>
