<section class="container mx-auto px-6 py-10">
    <h2 class="text-center text-2xl font-bold text-aoit-400 mb-14">Upcoming Events</h2>  
    <script src="https://apis.google.com/js/api.js"></script>      
    <script>
        var CLIENT_ID = '900934217608-3dhrgkhtngn8ut3qhtm1uds3rll7jl4g.apps.googleusercontent.com';
        var API_KEY = 'AIzaSyBPgM0s7e1F3LmzHwEn5Ep561IMnuZ0qXI';
        var CALENDAR_ID = 'c_2df89eb3b489793160cfcfbd402552c767b0c1421651d8382e804a7c1da77c83@group.calendar.google.com';
        var SCOPES = 'https://www.googleapis.com/auth/calendar.readonly';

        function handleClientLoad() {
            gapi.load('client:auth2', initClient);
        }

        function initClient() {
        gapi.client.init({
            apiKey: API_KEY,
            clientId: CLIENT_ID,
            discoveryDocs: ["https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest"],
            scope: SCOPES
        }).then(function () {
            // Call listUpcomingEvents after client has been initialized
            listUpcomingEvents();
        });
        }

        function listUpcomingEvents() {
        gapi.client.calendar.events.list({
            'calendarId': CALENDAR_ID,
            'timeMin': (new Date()).toISOString(),
            'showDeleted': false,
            'singleEvents': true,
            'maxResults': 10,
            'orderBy': 'startTime'
        }).then(function(response) {
            var events = response.result.items;
            var contentDiv = document.getElementById('content');

            if (events.length > 0) {
            contentDiv.innerHTML = '';
            for (var i = 0; i < events.length; i++) {
                var event = events[i];
                var when = event.start.dateTime;
                if (!when) {
                when = event.start.date;
                }
                contentDiv.innerHTML += '<p><b>' + event.summary + '</b><br>' + when + '</p>';
            }
            } else {
            contentDiv.innerHTML = '<p>No upcoming events found.</p>';
            }
        });
    }

    // Call handleClientLoad when the webpage has finished loading
    window.onload = handleClientLoad;
       
    </script>
<div id='content'>
</div>
</section>
