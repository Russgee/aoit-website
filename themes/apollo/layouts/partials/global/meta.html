<!-- Primary Meta Tags -->
<meta charset="utf-8">
{{ if eq .Page.RelPermalink "/404.html" }}
<title>Whoops! 404 Error: {{ .Site.Title}}</title>
{{ end }}
<title>{{ .Title }}{{ .Site.Title}}</title>
<meta name="title" content="{{ .Title }}{{ .Site.Title }} ">
{{ if eq .Page.RelPermalink "/404.html"}}
<meta name="robots" content="noindex">
{{ end }}
<meta name="title" content="{{ .Site.Title }} | {{ .Title }}">
<meta name="description" content="{{ .Site.Params.meta.description }}">
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="msapplication-TileColor" content="#2b5797">
<meta name="theme-color" content="#000000">

{{ if .Site.Params.facebook }}
<!-- Open Graph / Facebook -->
<meta property="og:type" content="website">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:title" content="{{ .Site.Title }} | {{ .Title }}">
<meta property="og:description" content="{{ .Site.Params.meta.description }}">
<meta property="og:image" content="{{ .Site.Params.meta.image }}">
{{ end }}

{{ if .Site.Params.twitter }}
<!-- Twitter -->
<meta property="twitter:card" content="summary_large_image">
<meta property="twitter:url" content="{{ .Permalink }}">
<meta property="twitter:title" content="{{ .Site.Title }} | {{ .Title }}">
<meta property="twitter:description" content="{{ .Site.Params.meta.description }}">
<meta property="twitter:image" content="{{ .Site.Params.meta.image }}">
{{ end }}
