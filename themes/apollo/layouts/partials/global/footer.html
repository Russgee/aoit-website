{{- partial "global/contact.html" . -}}
<footer class="bg-aoit-50 px-6 py-12">
    <div class="container mx-auto lg:grid lg:grid-cols-3 lg:gap-x-16 lg:gap-y-6">
        <div class="h-80 w-full rounded-3xl shadow-xl" id="map"></div>

        <div class="border-b-2 border-gray-400 py-12 lg:col-start-2 lg:col-end-4 lg:flex lg:justify-between">
            <div class="mb-10">
                <address class="not-italic mb-6">
                    <strong class="block text-lg mb-3 lg:text-xl">Academy of Innovative Technology</strong>
                    <p class=>Franklin K. Lane Educational Campus</p>
                    <p class=>999 Jamaica Avenue</p>
                    <p class=>Brooklyn, NY 11208</p>
                </address>

                <img class="w-24" src="/doe-logo.svg" alt="New York City Department of Education">
            </div>

            <div>
                <strong class="block text-lg mb-3 lg:text-xl">Contact Us</strong>
                <ul>
                    <li>Phone: (718) 827-2469</li>
                    <li>Fax: (718) 333-2358</li>
                    <li>Email: info@aoiths.org</li>
                </ul>
            </div>
        </div>

        <div class="w-full col-start-3 col-end-4 flex justify-end">
            {{ range .Site.Menus.social }}
                <a href="{{ .URL }}" target="_blank" class="mx-2">
                    {{ .Pre }}
                </a>
            {{ end }}
        </div>
    </div>
</footer>
