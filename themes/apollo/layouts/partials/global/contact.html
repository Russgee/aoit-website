<section class="px-6 py-12 bg-white">
  <div class="container mx-auto lg:w-7/12">
    <h2 class="text-center text-2xl font-bold text-aoit-400">Have a question? Feel free to contact us.</h2>

    <form>
      <fieldset class="lg:flex lg:gap-8">
        <div class="lg:w-6/12">
          <label class="label" for="name">Full Name</label>
          <input class="input bg-slate-50" type="text" id="name" name="name" required>
        </div>

        <div class="lg:w-6/12">
          <label class="label" for="phone">Phone Number</label>
          <input class="input bg-slate-50" type="tel" id="phone" name="phone" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" required>
          <small>Format: 123-456-7890</small>
        </div>
      </fieldset>


      <fieldset class="lg:flex lg:gap-8">
        <div class="lg:w-6/12">
          <label class="label" for="email">Email Address</label>
          <input class="input bg-slate-50" type="email" id="email" name="email" required>
        </div>
        
        <div class="lg:w-6/12">
          <label class="label" for="dropdown">Select concern</label>
          <select class="input bg-slate-50" id="dropdown" name="dropdown">
            <option value="" disabled selected>Select a concern...</option>
            <option value="item1">Item 1</option>
            <option value="item2">Item 2</option>
            <option value="item3">Item 3</option>
          </select>
        </div>
      </fieldset>
      
        <label class="label" for="details">Detailed Information</label>
        <textarea class="input bg-slate-50" id="details" name="details" rows="5"></textarea>
      
        <button class="btn w-full bg-aoit-500 text-white mt-10" type="submit">Submit</button>
      </form>
    </div>
    </section>
