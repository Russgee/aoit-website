<section class="px-6 py-12 bg-white">
  <div class="container mx-auto lg:w-7/12">
    <h2 class="form-heading text-center text-2xl font-bold text-aoit-400">Have a question? Feel free to contact us.</h2>
    <p class="form-desc"></p>

    <form id="form" netlify>
      <div class="">
        <label class="label" for="dropdown">Select concern</label>
        <select class="form-select input bg-slate-50" id="dropdown" name="dropdown">
          <option value="" disabled selected>Select a concern...</option>
        </select>
      </div>

      <fieldset class="lg:flex lg:gap-8">
        <legend>Personal Details</legend>
        <div class="lg:w-6/12">
          <label class="label" for="first-name">First Name</label>
          <input class="input bg-slate-50" type="text" id="first-name" name="first-name" required>

          <label class="label" for="last-name">Last Name</label>
          <input class="input bg-slate-50" type="text" id="last-name" name="last-name" required>
        </div>

        
        
        <div class="lg:w-6/12">
          <label class="label" for="phone">Phone Number</label>
          <input class="input bg-slate-50" type="tel" id="phone" name="phone" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" required>
          <small>Format: 123-456-7890</small>
        </div>

        <div class="lg:w-6/12">
          <label class="label" for="email">Email Address</label>
          <input class="input bg-slate-50" type="email" id="email" name="email" required>
        </div>
        
        <div class="lg:w-6/12" style="display: none;">
          <label class="label" for="date">Date of Birth</label>
          <input class="input bg-slate-50" type="date" id="date" name="date" required>
        </div>
        
      </fieldset>

      <hr />

      <span class="dvAddress" style="display: none;">
      <fieldset class="lg:flex lg:gap-8">

        <div class="lg:w-6/12">
          <label class="label" for="name">Address</label>
          <input class="input bg-slate-50" type="text" id="address" name="address" required>
        </div>

        <div class="lg:w-6/12">
          <label class="label" for="name">Address 2</label>
          <input class="input bg-slate-50" type="text" id="address2" name="address">
        </div>
      
      </fieldset>

      <fieldset class="lg:flex lg:gap-8">
        <div class="lg:w-3/12">
          <label class="label" for="city">City</label>
          <input class="input bg-slate-50" type="text" id="city" name="city" required>
        </div>

        <div class="lg:w-3/12">
          <label class="label" for="states">State</label>
          <select class="form-select input bg-slate-50" id="states" name="states" required>
            <option> Select State</option>
          </select>
        </div>

        <div class="lg:w-3/12">
          <label class="label" for="zipCode">Zipcode</label>
          <input class="input bg-slate-50" type="text" id="zipCode" name="zipCode" required>
        </div>

      </fieldset>
      
      <hr />
    </span>

      <fieldset class="lg:flex lg:gap-8">
        <legend>Your inquiry</legend>
        <label class="label" for="details">Detailed Information</label>
        <textarea class="input bg-slate-50" id="details" name="details" rows="5"></textarea>
        
      </fieldset>
      
        
      
        <button class="btn w-full bg-aoit-500 text-white mt-10" type="submit">Submit</button>
      </form>
    </div>
    </section>
